name: Build Google Play Store Bundle (AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Release Keystore & key.properties
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass avan_production_2026 -keypass avan_production_2026 -dname "CN=AVAN, OU=Engineering, O=AvanApp, L=SanFrancisco, ST=CA, C=US"
          echo "storePassword=avan_production_2026" > android/key.properties
          echo "keyPassword=avan_production_2026" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --verbose

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avan-playstore-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
