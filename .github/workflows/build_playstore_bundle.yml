name: Build Google Play Store Bundle (AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Restore Permanent Production Release Keystore
        run: |
          echo "" | base64 -d > android/app/release.keystore

      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation || (cd android && ./gradlew bundleRelease)

      - name: Copy AAB to root build output if needed
        run: |
          mkdir -p build/app/outputs/bundle/release
          find . -name "app-release.aab" -exec cp {} build/app/outputs/bundle/release/app-release.aab \;
          ls -la build/app/outputs/bundle/release/

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avan-playstore-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
