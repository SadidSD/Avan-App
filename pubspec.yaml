name: avan_app
description: AVAN Mindset & Affirmation App - Warm, Calm, Minimal & Meaningful.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.2
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.0
  shared_preferences: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  table_calendar: ^3.0.9
  intl: ^0.19.0
  speech_to_text: ^7.0.0
  record: 5.2.0
  in_app_purchase: ^3.2.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.6

dependency_overrides:
  record_linux: 2.1.1
  record_platform_interface: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "playstore_icon_512.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A12"
  adaptive_icon_foreground: "playstore_icon_512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_girl_profile.jpg
    - assets/images/onboarding_archway_sun.jpg
    - assets/images/onboarding_moon_clouds.jpg
    - assets/images/featured_meditation.jpg
    - assets/images/sleep_story_night.jpg
